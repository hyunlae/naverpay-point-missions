interface:
  display_name: "네이버페이 포인트 미션"
  short_description: "최초 로그인 유도와 검토 기반 실행을 지원하는 네이버페이 미션 스킬"
  default_prompt: "point.pay.naver.com의 네이버페이 포인트 미션을 discover -> 검토 -> run 흐름으로 실행합니다. 같은 state-dir를 재사용하고, 로그인은 수동으로 유지하며, headless 시작 시 저장된 세션이 없으면 화면 브라우저를 한 번 열어 로그인 후 다시 headless로 재개합니다."
runtime:
  skill_entrypoint: "SKILL.md"
  discover_command: "node scripts/discover_missions.mjs"
  run_command: "node scripts/run_missions.mjs"
safety:
  manual_login_required: true
  manual_verification_required: true
