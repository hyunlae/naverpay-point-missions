interface:
  display_name: "NaverPay Point Missions"
  short_description: "Reviewed NaverPay missions with login bootstrap"
  default_prompt: "Discover, review, and run NaverPay point missions from point.pay.naver.com. Reuse the same state-dir, keep login manual, and if headless starts without a saved session, open a visible browser once for login before resuming headless."
runtime:
  skill_entrypoint: "SKILL.md"
  discover_command: "node scripts/discover_missions.mjs"
  run_command: "node scripts/run_missions.mjs"
safety:
  manual_login_required: true
  manual_verification_required: true
